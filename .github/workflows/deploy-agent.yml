# Deploy a Managed Deep Agent example to LangSmith via `mda deploy`.
# For policy-desk, also builds and deploys the Vite UI to Cloudflare.
#
# Run from the Actions tab → "Deploy agent" → Run workflow.
#
# Required repository secrets:
#   LANGSMITH_API_KEY
#   OPENAI_API_KEY
#   MDA_INGRESS_SECRET
#   SLACK_BOT_TOKEN
#   SLACK_SIGNING_SECRET
#   SLACK_USER_TOKEN
#   MDA_GITHUB_TOKEN
#
# Optional repository secrets:
#   LANGSMITH_WORKSPACE_ID    # org-scoped keys / multi-workspace
#   LANGSMITH_ENDPOINT        # non-default LangSmith API host
#   X_BEARER_TOKEN            # marketing-assistant X reads
#   MDA_GUEST_SIGNING_KEY     # policy-desk identity
#   VITE_SUPABASE_URL         # policy-desk identity + UI
#
# policy-desk UI (Cloudflare) secrets — used only when that agent is selected:
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
#   VITE_SUPABASE_ANON_KEY
#   POLICY_DESK_DEPLOYMENT_API    # LangSmith MDA URL after first agent deploy
#
# Add new agents to `on.workflow_dispatch.inputs.agent.options` as they land.

name: Deploy agent

on:
  workflow_dispatch:
    inputs:
      agent:
        description: Agent project directory to deploy
        required: true
        type: choice
        options:
          - daily-update
          - marketing-assistant
          - policy-desk

permissions:
  contents: read

concurrency:
  group: deploy-agent-${{ inputs.agent }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.agent }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy MDA agent
        uses: ./.github/actions/deploy-mda-agent
        with:
          agent: ${{ inputs.agent }}
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_WORKSPACE_ID: ${{ secrets.LANGSMITH_WORKSPACE_ID }}
          LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MDA_INGRESS_SECRET: ${{ secrets.MDA_INGRESS_SECRET }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
          MDA_GITHUB_TOKEN: ${{ secrets.MDA_GITHUB_TOKEN }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          MDA_GUEST_SIGNING_KEY: ${{ secrets.MDA_GUEST_SIGNING_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}

      - name: Deploy Cloudflare UI
        if: inputs.agent == 'policy-desk'
        uses: ./.github/actions/deploy-cloudflare-ui
        with:
          working-directory: policy-desk
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          POLICY_DESK_DEPLOYMENT_API: ${{ secrets.POLICY_DESK_DEPLOYMENT_API }}
